[package]
name = "somalier"
kind = "tool"
version = "0.3.7"
release = 1
license = "Apache-2.0"
main = "src/main.taf"

[repository]
url = "https://github.com/taffish/somalier"

[command]
name = "taf-somalier"

[runtime]
pipe = true
command_mode = true

[container]
image = "ghcr.io/taffish/somalier:0.3.7-r1"
dockerfile = "docker/Dockerfile"
build_platforms = "linux/amd64,linux/arm64"

[meta]
domain = "bio"
categories = ["quality-control", "sample-identity", "relatedness", "population-genetics"]
keywords = ["Somalier", "sample swap", "sample identity", "relatedness", "pedigree", "ancestry", "contamination", "BAM", "CRAM", "VCF", "GVCF"]
description = "Somalier 0.3.7 runtime for extracting compact genome sketches and checking sample identity, relatedness, ancestry, and contamination."

[upstream]
name = "Somalier"
type = "github"
repo = "brentp/somalier"
homepage = "https://github.com/brentp/somalier"
manual = "https://github.com/brentp/somalier#usage"
release_url = "https://github.com/brentp/somalier/releases/tag/v0.3.7"
downloads = "https://github.com/brentp/somalier/archive/refs/tags/v0.3.7.tar.gz"
version = "0.3.7"
commit = "c9422c0d6bdb5781841d0f940a599db94e2915f5"
license = "MIT"
description = "Rapid sample identity and relatedness estimation from compact sketches extracted from alignments or variant calls."
citation = "Pedersen BS, Bhetariya PJ, Brown J, et al. Somalier: rapid relatedness estimation for cancer and germline studies using efficient genome sketches. Genome Medicine. 2020;12:62."
doi = "10.1186/s13073-020-00761-2"
watch = "tags"
strip_prefix = "v"

[smoke]
backend = "docker"
timeout = 600
exist = ["somalier", "somalier-resources", "python3", "curl", "sh", "awk", "grep", "gzip", "ldd", "mktemp", "sed", "cmp", "sha256sum", "tail"]
test = ["grep -F 'source_sha256=d04c1a7f4fe3483664a6e4fa5403ca81e8cbbe7d8d5d75fa5633df8b0ac83fd6' /opt/somalier/share/doc/somalier/source.txt >/dev/null && grep -F 'upstream_commit=c9422c0d6bdb5781841d0f940a599db94e2915f5' /opt/somalier/share/doc/somalier/source.txt >/dev/null", "/opt/somalier/share/testdata/somalier-smoke.sh identity", "/opt/somalier/share/testdata/somalier-smoke.sh extract-vcf", "/opt/somalier/share/testdata/somalier-smoke.sh extract-bam", "/opt/somalier/share/testdata/somalier-smoke.sh extract-cram", "/opt/somalier/share/testdata/somalier-smoke.sh relate", "/opt/somalier/share/testdata/somalier-smoke.sh ab-plot", "/opt/somalier/share/testdata/somalier-smoke.sh contamination", "/opt/somalier/share/testdata/somalier-smoke.sh find-sites", "/opt/somalier/share/testdata/somalier-smoke.sh pedrel", "/opt/somalier/share/testdata/somalier-smoke.sh ancestry", "/opt/somalier/share/testdata/somalier-smoke.sh cigar-boundary", "/opt/somalier/share/testdata/somalier-smoke.sh resources", "/opt/somalier/share/testdata/somalier-smoke.sh reference-error", "/opt/somalier/share/testdata/somalier-smoke.sh reference-counts", "/opt/somalier/share/testdata/somalier-smoke.sh release-regressions"]
